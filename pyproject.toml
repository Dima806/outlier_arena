[project]
name = "outlier-arena"
version = "0.1.0"
description = "Six outlier detectors walk into your dataset and disagree on 80 percent of it"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",   # required by `make test-cov` (--cov); not in the PRD list
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# No [build-system]: the library lives in a bare `src/` directory rather than an
# installable named package, so uv treats this as a virtual project (installs the
# dependencies, not the project itself). Notebooks, the app, and tests run from the
# repo root and import via `from src...`.

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
# E501: line length is handled by the formatter. N803/N806: `X` is the standard
# name for a feature matrix across ML code (and the project's public API, e.g.
# detect_outliers(X, ...)), so allow the uppercase argument/variable name.
ignore = ["E501", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# The library is a bare `src/` dir (no install step), so put the repo root on
# sys.path for `from src...` imports during tests.
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
